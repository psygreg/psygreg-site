  <style>
    :root {
      --accent: #b44848;
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --surface: #f5f5f5;
      --border: #dddddd;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --text: #f5f5f5;
        --muted: #a8a8a8;
        --surface: #171717;
        --border: #2d2d2d;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --surface: #f5f5f5;
      --border: #dddddd;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    :root[data-theme="dark"] {
      --bg: #0d0d0d;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --surface: #171717;
      --border: #2d2d2d;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--shadow);
      transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      width: min(100%, 1180px);
      text-align: center;
    }

    .portrait-wrap {
      width: 188px;
      height: 188px;
      margin: 0 auto 28px;
      padding: 5px;
      border: 2px solid var(--accent);
      border-radius: 50%;
    }

    .portrait {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      background: var(--surface);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 750;
    }

    .identity-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .tagline {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
      white-space: nowrap;
    }

    .accent-line {
      width: 44px;
      height: 3px;
      margin: 24px auto;
      border-radius: 999px;
      background: var(--accent);
    }

    .socials {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
    }

    .social-link {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      outline: none;
    }

    .social-link img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .icon-placeholder {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px dashed currentColor;
      border-radius: 5px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }

    @media (max-width: 560px) {
      .tagline {
        white-space: normal;
      }

      .socials {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 480px) {
      body {
        padding-top: 84px;
      }

      .portrait-wrap {
        width: 164px;
        height: 164px;
      }
    }
  </style>
</head>
<body>

      </nav>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('.theme-toggle');
    const icon = document.querySelector('.theme-icon');
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'light' || savedTheme === 'dark') {
      root.dataset.theme = savedTheme;
    }

    function effectiveTheme() {
      if (root.dataset.theme) return root.dataset.theme;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateSocialIcons() {
      const theme = effectiveTheme();
      document.querySelectorAll('img[data-icon-light][data-icon-dark]').forEach(image => {
        image.src = theme === 'dark' ? image.dataset.iconDark : image.dataset.iconLight;
      });
    }

    function updateThemeUI() {
      if (effectiveTheme() === 'dark') {
        icon.innerHTML = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>';
      } else {
        icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"></path>';
      }
      updateSocialIcons();
    }

    toggle.addEventListener('click', () => {
      const nextTheme = effectiveTheme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = nextTheme;
      localStorage.setItem('theme', nextTheme);
      updateThemeUI();
    });

    const shareLink = document.querySelector('.share-link');

    shareLink?.addEventListener('click', async event => {
      event.preventDefault();

      try {
        await navigator.clipboard.writeText(window.location.href);
        shareLink.title = 'Link copiado!';
      } catch {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = window.location.href;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();

          const copied = document.execCommand('copy');
          textarea.remove();

          shareLink.title = copied ? 'Link copiado!' : 'Não foi possível copiar o link.';
        } catch {
          shareLink.title = 'Não foi possível copiar o link.';
        }
      }

      window.setTimeout(() => {
        shareLink.title = 'Copiar link da página';
      }, 1800);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!root.dataset.theme) updateThemeUI();
    });

    updateThemeUI();
  </script>
